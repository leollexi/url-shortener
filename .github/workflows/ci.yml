name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]              # запускать также на push тегов v1.0.0 и т.п.
  pull_request:
    branches: [ main ]

jobs:
  # === Задача 1: тесты ===
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest -v

  # === Задача 2: сборка и публикация (только после успешных тестов) ===
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # на PR только тестируем, не пушим образ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Генерируем красивые теги автоматически
      - name: Docker metadata (теги)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
